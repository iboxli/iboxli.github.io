        man:"ऐप नहीं खुल रहा? iboxli में ⋮ › <b>साथ में</b> पर टैप करें और कोड डालें।",
        soon:"अभी iboxli नहीं है? ऐप जल्द ही Google Play पर आ रहा है।", get:"iboxli डाउनलोड करें",

  // Sprache des Handys (Browser), sonst Englisch
  var langs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"]);
  var lang = "en";
  for (var i = 0; i < langs.length; i++) { var k = (langs[i] || "").toLowerCase().slice(0, 2); if (L[k]) { lang = k; break; } }
  var T = L[lang];
  document.documentElement.lang = lang;
  if (lang === "ar") document.documentElement.dir = "rtl";
  document.title = T.t + " · iboxli";
  document.getElementById("tTitle").textContent = T.t;
  document.getElementById("tInv").innerHTML = T.inv;

  var q = new URLSearchParams(location.search);
  var c = (q.get("c") || "").replace(/\D/g, "").slice(0, 6);
  if (c.length === 6) document.getElementById("code").textContent = c.slice(0, 3) + " " + c.slice(3);

  var ua = navigator.userAgent, android = /android/i.test(ua), ios = /iphone|ipad|ipod/i.test(ua);
  var wechat = /MicroMessenger/i.test(ua);
  // WhatsApp: eigener Browser (Kennung „WhatsApp“) oder Chrome-Fenster in WhatsApp (Herkunft android-app://com.whatsapp)
  var whatsapp = android && (/WhatsApp/i.test(ua) || /^android-app:\/\/com\.whatsapp/i.test(document.referrer || ""));
  var open = document.getElementById("open");
  open.textContent = T.open;
  var fallback = location.href + (location.search ? "&" : "?") + "nf=1";
  var intent = "intent://join?c=" + c + "#Intent;scheme=iboxli;package=com.iboxli.app;" +
               "S.browser_fallback_url=" + encodeURIComponent(fallback) + ";end";
  open.href = android && !wechat ? intent : "iboxli://join?c=" + c;

  // QR-Code mit dem Einladungslink (wird hier im Browser erzeugt, kein fremder Dienst)
  document.getElementById("tQr").innerHTML = T.qr;
  try {
    var qr = new IBXQR.QRCode(-1, IBXQR.L.M);
    qr.addData(location.origin + "/j?c=" + c); qr.make();
    var n = qr.getModuleCount(), d = "";
    for (var r = 0; r < n; r++) for (var x = 0; x < n; x++) if (qr.isDark(r, x)) d += "M" + x + " " + r + "h1v1h-1z";
    document.getElementById("qr").innerHTML = '<svg viewBox="0 0 ' + n + ' ' + n + '" shape-rendering="crispEdges" role="img" aria-label="QR">' +
      '<path d="' + d + '" fill="#000"/></svg>';
  } catch (e) { document.getElementById("qr").style.display = "none"; document.getElementById("tQr").style.display = "none"; }
  if (c.length !== 6) { document.getElementById("qr").style.display = "none"; document.getElementById("tQr").style.display = "none"; }

  // Hilfe, falls nichts passiert (z. B. Chrome-Tab aus WhatsApp blockiert das Öffnen anderer Apps)
  var help = document.getElementById("help");
  document.getElementById("tHint").textContent = T.hint;
  var copyBtn = document.getElementById("copy"); copyBtn.textContent = T.copy;
  var retry = document.getElementById("retry"); retry.textContent = T.retry;
  retry.href = location.pathname + "?c=" + c;
  if (android && !wechat) open.addEventListener("click", function () {
    var left = false;
    function gone() { if (document.hidden) left = true; }
    document.addEventListener("visibilitychange", gone);
    window.addEventListener("blur", function b() { left = true; window.removeEventListener("blur", b); });
    setTimeout(function () {
      document.removeEventListener("visibilitychange", gone);
      if (!left) help.style.display = "block";
    }, 2000);
  });
  // Aus WhatsApp: gleich erklären, wie es klappt (der Knopf bleibt, falls es doch direkt geht)
  if (whatsapp) {
    document.getElementById("tWa").innerHTML = T.wa;
    document.getElementById("wa").style.display = "flex";
    help.style.display = "block";
    document.getElementById("tHint").style.display = "none";   // steht schon oben im Hinweis
  }
  copyBtn.addEventListener("click", function (e) {
    e.preventDefault();
    function done() { document.getElementById("tCopied").innerHTML = T.copied; }
    function fallbackCopy() {
      var t = document.createElement("textarea"); t.value = c; document.body.appendChild(t); t.select();
      try { document.execCommand("copy"); done(); } catch (x) {} document.body.removeChild(t);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(c).then(done, fallbackCopy);
    else fallbackCopy();
  });

  // Ohne App: Hinweis auf den Play Store (bzw. „bald verfügbar“)
  var noApp = document.getElementById("tNoApp");
  if (STORE && !ios) noApp.innerHTML = '<a href="' + STORE + '" style="color:#2EE6A8">' + T.get + '</a>';
  else if (!ios) noApp.textContent = T.soon;

  // WeChat blockiert das Öffnen anderer Apps -> Hinweis, die Seite im Browser zu öffnen
  if (wechat) { var w = document.getElementById("wx"); w.textContent = T.wx; w.style.display = "block";
                document.body.style.paddingTop = "90px"; }
  // Kein automatisches Öffnen: Xiaomi/WhatsApp blockieren das und schließen die Seite.
  // Der Knopf „In iboxli öffnen“ (Tippen) funktioniert zuverlässig.
})();
